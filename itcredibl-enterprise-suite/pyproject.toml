[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "itcredibl-enterprise"
version = "0.2.0"
description = "ITcredibl Enterprise Demo Suite"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27.0",
  "rich>=13.7.1",
  "tenacity>=8.2.3",
  "typer>=0.12.3",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = ["ruff>=0.5.6", "black>=24.4.2", "mypy>=1.10.0", "pytest>=8.2.0", "types-requests", "pre-commit>=3.7.0"]
obs = ["opentelemetry-api>=1.25.0", "opentelemetry-sdk>=1.25.0", "opentelemetry-instrumentation-httpx>=0.46b0", "datadog>=0.49.1", "statsd>=4.0.1"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
itcredibl = "itcredibl_enterprise_cli:app"
