[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "itcredibl-enterprise"
version = "0.1.0"
description = "ITcredibl Enterprise Demo Suite"
requires-python = ">=3.9"
dependencies = [
  "httpx>=0.27.0",
  "rich>=13.7.1",
  "tenacity>=8.2.3",
  "typer>=0.12.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
itcredibl = "itcredibl_enterprise_cli:app"
