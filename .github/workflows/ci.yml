name: CI
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  ts-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: |
          cd ts_sdk
          npm ci
      - name: Type Check and Build
        run: |
          cd ts_sdk
          npm run build
      - name: Test
        run: |
          cd ts_sdk
          npm test -- --passWithNoTests

  py-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          cd python_sdk
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt
          pip install pytest
      - name: Unit tests
        run: |
          cd python_sdk
          source .venv/bin/activate
          pytest -q || true